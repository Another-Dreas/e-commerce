<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Login - Another Fashion E-commerce" />
    <title>Login - Another Fashion E-commerce</title>

    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" 
          rel="stylesheet">

    <script>
        tailwind.config = { darkMode: 'class' };
    </script>

    <!-- STYLE TANPA @apply — FULL CSS -->
 <style>
    body {
        font-family: 'Inter', sans-serif;
        background: radial-gradient(circle at top right, #fdfbfb 0%, #ebedee 100%);
    }
    .dark body {
        background: radial-gradient(circle at top right, #1a1a1a 0%, #000000 100%);
    }

    /* GLASSMORPHISM CARD */
    .login-card {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(10px);
        padding: 3rem;
        border-radius: 2rem;
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 20px 40px rgba(0,0,0,0.06);
        width: 100%;
        max-width: 450px;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .login-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 30px 60px rgba(0,0,0,0.1);
    }

    .dark .login-card {
        background: rgba(20, 20, 20, 0.8);
        border-color: rgba(255, 255, 255, 0.1);
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    /* INPUT STYLING */
    .login-input {
        width: 100%;
        padding: 1rem 1.2rem;
        border-radius: 1rem;
        border: 2px solid transparent;
        background: #f1f5f9;
        outline: none;
        font-size: 0.95rem;
        transition: all 0.3s ease;
    }
    .login-input:focus {
        border-color: #000;
        background: #fff;
        box-shadow: 0 0 0 4px rgba(0,0,0,0.05);
    }

    .dark .login-input {
        background: #262626;
        color: white;
    }
    .dark .login-input:focus {
        border-color: #fff;
        background: #1a1a1a;
    }

    /* BUTTON ANIMATION */
    .login-btn {
        width: 100%;
        padding: 1rem;
        background: #000;
        color: #fff;
        border-radius: 1rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }
    .login-btn:hover {
        background: #333;
        letter-spacing: 2px;
    }
    .dark .login-btn {
        background: #fff;
        color: #000;
    }

    /* BACKGROUND DECORATION */
    .bg-shape {
        position: absolute;
        z-index: -1;
        filter: blur(80px);
        border-radius: 50%;
    }
</style>

<body class="bg-white dark:bg-black dark:text-white transition-all duration-300 overflow-x-hidden">

    <div class="bg-shape bg-yellow-200/50 w-64 h-64 top-20 -left-20"></div>
    <div class="bg-shape bg-blue-200/30 w-96 h-96 bottom-10 -right-20"></div>

    <div include-html="../auth/navbar-auth.html"></div>

    <main class="min-h-screen flex items-center justify-center px-6 pt-20">
        <div class="login-card">
            <div class="mb-10 text-center">
                <h1 class="text-4xl font-black tracking-tight mb-3">Welcome Back</h1>
                <p class="login-desc text-lg">Senang melihat Anda kembali!</p>
            </div>

            <form class="space-y-6">
                <div>
                    <label class="login-label text-sm mb-2 ml-1">Email Address</label>
                    <div class="relative">
                        <input type="email" placeholder="name@example.com" class="login-input" required>
                    </div>
                </div>

                <div class="mb-2">
                    <div class="flex justify-between items-center mb-2 ml-1">
                        <label class="login-label text-sm">Password</label>
                        <a href="#" class="text-xs font-semibold hover:underline opacity-60">Lupa Password?</a>
                    </div>
                    <input type="password" placeholder="••••••••" class="login-input" required>
                </div>

                <button type="submit" class="login-btn shadow-lg">
                    Masuk
                </button>
            </form>

            <div class="relative my-8">
                <div class="absolute inset-0 flex items-center"><span class="w-full border-t dark:border-gray-800"></span></div>
                <div class="relative flex justify-center text-xs uppercase"><span class="bg-white dark:bg-[#141414] px-2 text-gray-500">Atau masuk dengan</span></div>
            </div>

            <div class="flex gap-4 mb-8">
                <button class="flex-1 py-3 border dark:border-gray-800 rounded-xl flex justify-center hover:bg-gray-50 dark:hover:bg-white/5 transition">
                    <i class="fab fa-google text-lg"></i>
                </button>
                <button class="flex-1 py-3 border dark:border-gray-800 rounded-xl flex justify-center hover:bg-gray-50 dark:hover:bg-white/5 transition">
                    <i class="fab fa-apple text-lg"></i>
                </button>
            </div>

            <p class="text-center text-sm text-gray-500">
                Belum punya akun? 
                <a href="register.html" class="font-bold text-black dark:text-white hover:underline">Buat akun gratis</a>
            </p>
        </div>
    </main>

    <!-- FOOTER -->
    <div include-html="../components/footer.html"></div>

    <script src="../js/include.js"></script>
    <script src="../script.js"></script>

</body>
</html>
